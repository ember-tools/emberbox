name: Publish @emberbox/lint

on:
  push:
    tags:
      - "lint-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check that the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Install dependencies
        run: nix-shell --run "./toolchain.sh install-clean"
      - name: Check that the tag matches the package version
        run: |
          version="$(nix-shell --run "node -p \"require('./packages/lint/package.json').version\"" | tail -1)"
          if [ "lint-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match @emberbox/lint $version" >&2
            exit 1
          fi
      - name: Verify
        run: nix-shell --run "./toolchain.sh verify && ./toolchain.sh lint-probe"
      - name: Use the npm token while trusted publishing is not set up
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: env.NPM_TOKEN != ''
        run: echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > "$HOME/.npmrc"
      - name: Publish
        run: nix-shell --run "npm publish -w @emberbox/lint --access public --provenance"
