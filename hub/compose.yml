services:
  hub:
    image: ghcr.io/ember-tools/emberbox-hub:latest
    restart: unless-stopped
    volumes:
      - ./config:/etc/emberbox:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.emberbox-hub.rule: "Host(`emberbox.app`)"
      traefik.http.routers.emberbox-hub.entrypoints: websecure
      traefik.http.routers.emberbox-hub.tls.certresolver: letsencrypt
      traefik.http.services.emberbox-hub.loadbalancer.server.port: "80"
