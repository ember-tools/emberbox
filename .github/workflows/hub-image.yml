name: Hub image

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: fassung
        run: |
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "gebaut=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: hub/Dockerfile
          push: ${{ github.event_name == 'push' }}
          build-args: |
            COMMIT=${{ steps.fassung.outputs.commit }}
            GEBAUT=${{ steps.fassung.outputs.gebaut }}
          tags: |
            ghcr.io/rainbowdashlabs/emberbox-hub:latest
            ghcr.io/rainbowdashlabs/emberbox-hub:${{ steps.fassung.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
